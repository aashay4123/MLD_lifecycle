version: "3.9"

services:
  mlflow:
    build:
      context: .
      dockerfile: docker/Dockerfile.${MODE:-dev}
    container_name: mlflow_container
    env_file:
      - .env
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    volumes:
      - ./mlruns:/app/mlruns
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ./.zen:/app/.zen
    command: >
      sh -c "mlflow server 
        --backend-store-uri sqlite:///app/.zen/mlflow.db 
        --default-artifact-root /app/mlruns 
        --host 0.0.0.0 
        --port 5000"

  zenml:
    image: python:3.11-slim
    container_name: zenml_stack
    env_file:
      - .env
    volumes:
      - .:/app
    working_dir: /app
    command: >
      sh -c "pip install poetry &&
             poetry install &&
             poetry run zenml up"

  streamlit:
    build:
      context: .
      dockerfile: docker/Dockerfile.${MODE:-dev}
    container_name: streamlit_ui
    env_file:
      - .env
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    volumes:
      - .:/app
    command: >
      sh -c "streamlit run app/main.py --server.port=8501"

  fastapi:
    build:
      context: .
      dockerfile: docker/Dockerfile.${MODE:-dev}
    container_name: fastapi_backend
    env_file:
      - .env
    ports:
      - "${FASTAPI_PORT:-8000}:8000"
    volumes:
      - .:/app
    command: >
      sh -c "uvicorn api.main:app --host 0.0.0.0 --port 8000"

  optuna-dashboard:
    image: ghcr.io/optuna/optuna-dashboard
    container_name: optuna_ui
    ports:
      - "${OPTUNA_PORT:-8080}:8080"
    command: ["optuna-dashboard", "sqlite:///optuna.db"]

  evidently:
    image: evidentlyai/evidently
    container_name: evidently_report
    ports:
      - "${EVIDENTLY_PORT:-8888}:8501"
    volumes:
      - ./reports:/app/reports
