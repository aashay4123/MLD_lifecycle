# ─────────────────────────────────────────────
# 📦 Multi-Service Docker Compose (Dev + Prod)
# ─────────────────────────────────────────────

version: "3.9"

services:
  zenml:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    volumes:
      - ..:/app
      - zenml_volume:/app/.zen
    ports:
      - "9000:9000"
    command: ["make", "devup"]
    environment:
      - ENV=development

  mlflow:
    image: ghcr.io/mlflow/mlflow
    ports:
      - "7000:5000"
    volumes:
      - mlruns_volume:/mlflow/mlruns
      - ./mlflow:/mlflow
    command: mlflow server \
      --backend-store-uri sqlite:///mlflow.db \
      --default-artifact-root /mlflow/mlruns \
      --host 0.0.0.0 --port 5000

  streamlit:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    volumes:
      - ..:/app
    ports:
      - "8501:8501"
    command: streamlit run dashboard/app.py

  fastapi:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    volumes:
      - ..:/app
    ports:
      - "8080:8080"
    command: uvicorn src.main:app --host 0.0.0.0 --port 8080

  optuna-dashboard:
    image: ghcr.io/optuna/optuna-dashboard
    ports:
      - "8088:8080"
    volumes:
      - ./optuna_storage:/optuna
    command: ["optuna-dashboard", "sqlite:///optuna/optuna.db"]

  evidently:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    volumes:
      - ..:/app
    ports:
      - "8888:8888"
    command: python -m evidently ui

volumes:
  zenml_volume:
  mlruns_volume:
